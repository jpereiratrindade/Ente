name: ENTE-1 Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14 (Debug)
            compiler: g++-14
            pkg: g++-14
            build_type: Debug
            enable_sanitizers: OFF
            cxx_flags: ""
            extra_packages: ""

          - name: GCC 14 (ASan + LSan)
            compiler: g++-14
            pkg: g++-14
            build_type: Debug
            enable_sanitizers: ON
            cxx_flags: ""
            extra_packages: ""

          - name: Clang 18 (C++23)
            compiler: clang++-18
            pkg: clang-18
            build_type: Release
            enable_sanitizers: OFF
            cxx_flags: -stdlib=libc++
            extra_packages: libc++-18-dev libc++abi-18-dev

    steps:
    - uses: actions/checkout@v4

    - name: Install Build Dependencies & Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libssl-dev ${{ matrix.pkg }} ${{ matrix.extra_packages }}

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_SANITIZERS=${{ matrix.enable_sanitizers }}

    - name: Build ENTE-0
      run: cmake --build build

    - name: Execute Constitutive Test Suite
      run: ctest --test-dir build --output-on-failure --verbose

    - name: Verify CMake Package Installation & Export
      run: |
        cmake --install build --prefix /tmp/ente_install
        test -f /tmp/ente_install/lib64/cmake/Ente/EnteConfig.cmake || test -f /tmp/ente_install/lib/cmake/Ente/EnteConfig.cmake

    - name: Test Real External CMake Consumer
      run: |
        cmake -S examples/consumer-package-test -B /tmp/ente_consumer_build -G Ninja \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
          -DCMAKE_PREFIX_PATH=/tmp/ente_install
        cmake --build /tmp/ente_consumer_build
        /tmp/ente_consumer_build/ente_consumer_test
